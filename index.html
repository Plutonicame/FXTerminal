<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="color-scheme" content="dark">
<title>FX Terminal</title>
<meta name="description" content="Analyse fondamentale des devises : calendrier économique, discours des banques centrales et événements macro.">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&family=Roboto:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== Écran de connexion (affiché tant qu'il n'y a pas de session) ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <p class="login-text">Connecte-toi avec ton compte Google pour accéder à l'application.</p>
    <button type="button" class="btn-google" id="googleSignInBtn">
      <svg class="btn-google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continuer avec Google</span>
    </button>
    <p class="login-note" id="loginNote" hidden></p>
  </div>
</div>

<!-- ===== Appli (masquée tant que non connecté) ===== -->
<div id="appShell" hidden>

<!-- ===== Barre de navigation ===== -->
<header class="topbar">
  <button type="button" class="burger" id="burgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sideMenu">
    <span></span><span></span><span></span>
  </button>

  <div class="clocks" aria-label="Heures des sessions de trading">
    <div class="clock">
      <span class="clock-city">New York</span>
      <span class="clock-time" id="clock-ny">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">London</span>
      <span class="clock-time" id="clock-ldn">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">Tokyo</span>
      <span class="clock-time" id="clock-tky">--:--:--</span>
    </div>
  </div>

  <div class="session-badge" id="sessionBadge">
    <span id="sessionLabel">—</span>
  </div>
</header>

<nav class="side-menu" id="sideMenu" aria-hidden="true">
  <button type="button" class="menu-close" id="menuCloseBtn">Fermer ✕</button>

  <button type="button" class="menu-tab is-active" data-tab="tab-1" aria-current="true">
    Analyse par devise
  </button>

  <button type="button" class="menu-tab" data-tab="tab-2">
    Événements secondaires
  </button>

  <button type="button" class="menu-tab" data-tab="tab-3">
    Paramètres
  </button>

  <button type="button" class="menu-tab" id="logoutBtn">
    Se déconnecter
  </button>

  <span class="menu-account-email" id="menuAccountEmail"></span>
</nav>

<main class="app-main">

  <section class="tab-panel is-active" id="tab-1" role="tabpanel" aria-label="Analyse par devise">
    <!-- Onglet 1 : volontairement vide pour le moment -->
  </section>

  <section class="tab-panel" id="tab-2" role="tabpanel" aria-label="Événements secondaires" hidden>
    <!-- Onglet 2 : volontairement vide pour le moment -->
  </section>

  <section class="tab-panel" id="tab-3" role="tabpanel" aria-label="Paramètres" hidden>
    <div class="settings-row">
      <span class="settings-label">Thème</span>
      <button type="button" class="settings-btn" id="themeBtn">Thème</button>
    </div>
  </section>

</main>

<!-- ===== Panneau Thème & Mode Stylo (plein écran) ===== -->
<div class="theme-panel" id="themePanel" hidden>
  <div class="theme-panel-topbar">
    <span class="theme-panel-title">Thème &amp; Mode Stylo</span>
    <div class="theme-panel-actions">
      <button type="button" class="theme-pill-btn">Stylo</button>
      <button type="button" class="theme-pill-btn theme-pill-btn--icon" aria-label="Réinitialiser">↻</button>
      <button type="button" class="theme-pill-btn" id="themePanelToggleBtn">Thème</button>
    </div>
  </div>

  <div class="theme-panel-body">
    <button type="button" class="theme-accordion-row" data-section="connexion">
      <span class="chevron">›</span> Connexion
    </button>
    <button type="button" class="theme-accordion-row" data-section="analyse">
      <span class="chevron">›</span> Analyse
    </button>
    <button type="button" class="theme-accordion-row" data-section="evenements">
      <span class="chevron">›</span> Événements
    </button>
    <button type="button" class="theme-accordion-row" data-section="parametres">
      <span class="chevron">›</span> Paramètres
    </button>
    <button type="button" class="theme-accordion-row" data-section="general">
      <span class="chevron">›</span> Général
    </button>
  </div>

  <div class="theme-panel-footer">
    <button type="button" class="theme-footer-btn theme-footer-btn--primary" id="applySettingsBtn">✓ Appliquer</button>
    <button type="button" class="theme-footer-btn" id="resetSettingsBtn">↻ Réinitialiser</button>
    <button type="button" class="theme-footer-btn" id="collapseColorsBtn">▲ Replier les couleurs</button>
  </div>
</div>

</div><!-- /#appShell -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="./supabase-config.js" defer></script>
<script src="./auth.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
