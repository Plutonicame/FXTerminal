<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="color-scheme" content="dark">
<title>FX Terminal</title>
<meta name="description" content="Analyse fondamentale des devises : calendrier économique, discours des banques centrales et événements macro.">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&family=Roboto:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== Écran de connexion (affiché tant qu'il n'y a pas de session) ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <p class="login-text">Connecte-toi avec ton compte Google pour accéder à l'application.</p>
    <button type="button" class="btn-google" id="googleSignInBtn">
      <svg class="btn-google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continuer avec Google</span>
    </button>
    <p class="login-note" id="loginNote" hidden></p>
  </div>
</div>

<!-- ===== Appli (masquée tant que non connecté) ===== -->
<div id="appShell" hidden>

<!-- ===== Barre de navigation ===== -->
<header class="topbar">
  <button type="button" class="burger" id="burgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sideMenu">
    <span></span><span></span><span></span>
  </button>

  <div class="clocks" aria-label="Heures des sessions de trading">
    <div class="clock">
      <span class="clock-city">New York</span>
      <span class="clock-time" id="clock-ny">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">London</span>
      <span class="clock-time" id="clock-ldn">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">Tokyo</span>
      <span class="clock-time" id="clock-tky">--:--:--</span>
    </div>
  </div>

  <div class="session-badge" id="sessionBadge">
    <span id="sessionLabel">—</span>
  </div>
</header>

<nav class="side-menu" id="sideMenu" aria-hidden="true">
  <button type="button" class="menu-close" id="menuCloseBtn">Fermer ✕</button>

  <button type="button" class="menu-tab menu-tab--analyse is-active" data-tab="tab-1" aria-current="true">
    Analyse par devise
  </button>

  <button type="button" class="menu-tab menu-tab--evenements" data-tab="tab-2">
    Événements secondaires
  </button>

  <button type="button" class="menu-tab menu-tab--parametres" data-tab="tab-3">
    Paramètres
  </button>

  <button type="button" class="menu-tab menu-tab--deconnexion" id="logoutBtn">
    <svg class="menu-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span>Déconnexion</span>
  </button>
</nav>

<main class="app-main">

  <section class="tab-panel is-active" id="tab-1" role="tabpanel" aria-label="Analyse par devise">
    <div class="currency-bar" role="tablist" aria-label="Devises">
      <button type="button" class="currency-card" role="tab" data-currency="USD" aria-selected="false" aria-controls="currency-panel-USD">USD</button>
      <button type="button" class="currency-card" role="tab" data-currency="EUR" aria-selected="false" aria-controls="currency-panel-EUR">EUR</button>
      <button type="button" class="currency-card" role="tab" data-currency="JPY" aria-selected="false" aria-controls="currency-panel-JPY">JPY</button>
      <button type="button" class="currency-card" role="tab" data-currency="GBP" aria-selected="false" aria-controls="currency-panel-GBP">GBP</button>
      <button type="button" class="currency-card" role="tab" data-currency="CHF" aria-selected="false" aria-controls="currency-panel-CHF">CHF</button>
      <button type="button" class="currency-card" role="tab" data-currency="CAD" aria-selected="false" aria-controls="currency-panel-CAD">CAD</button>
      <button type="button" class="currency-card" role="tab" data-currency="AUD" aria-selected="false" aria-controls="currency-panel-AUD">AUD</button>
      <button type="button" class="currency-card" role="tab" data-currency="NZD" aria-selected="false" aria-controls="currency-panel-NZD">NZD</button>
      <button type="button" class="currency-card" role="tab" data-currency="CNY" aria-selected="false" aria-controls="currency-panel-CNY">CNY</button>
    </div>

    <div class="currency-panels">
      <section class="currency-panel" id="currency-panel-USD" role="tabpanel" data-currency="USD" aria-label="Analyse USD" hidden>
        <div class="calendar" data-currency="USD" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-EUR" role="tabpanel" data-currency="EUR" aria-label="Analyse EUR" hidden>
        <div class="calendar" data-currency="EUR" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-JPY" role="tabpanel" data-currency="JPY" aria-label="Analyse JPY" hidden>
        <div class="calendar" data-currency="JPY" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-GBP" role="tabpanel" data-currency="GBP" aria-label="Analyse GBP" hidden>
        <div class="calendar" data-currency="GBP" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-CHF" role="tabpanel" data-currency="CHF" aria-label="Analyse CHF" hidden>
        <div class="calendar" data-currency="CHF" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-CAD" role="tabpanel" data-currency="CAD" aria-label="Analyse CAD" hidden>
        <div class="calendar" data-currency="CAD" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-AUD" role="tabpanel" data-currency="AUD" aria-label="Analyse AUD" hidden>
        <div class="calendar" data-currency="AUD" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-NZD" role="tabpanel" data-currency="NZD" aria-label="Analyse NZD" hidden>
        <div class="calendar" data-currency="NZD" aria-live="polite"></div>
      </section>
      <section class="currency-panel" id="currency-panel-CNY" role="tabpanel" data-currency="CNY" aria-label="Analyse CNY" hidden>
        <div class="calendar" data-currency="CNY" aria-live="polite"></div>
      </section>
    </div>
  </section>

  <section class="tab-panel" id="tab-2" role="tabpanel" aria-label="Événements secondaires" hidden>
    <!-- Onglet 2 : volontairement vide pour le moment -->
  </section>

  <section class="tab-panel" id="tab-3" role="tabpanel" aria-label="Paramètres" hidden>
    <div class="settings-row">
      <span class="settings-label">Thème</span>
      <button type="button" class="settings-btn" id="themeBtn">Thème</button>
    </div>
  </section>

</main>

<!-- ===== Panneau Thème & Mode Stylo (plein écran) ===== -->
<div class="theme-panel" id="themePanel" hidden>
  <div class="theme-panel-card">
    <div class="theme-panel-topbar">
      <span class="theme-panel-title">Thème</span>
      <div class="theme-panel-actions">
        <button type="button" class="theme-pill-btn" id="themePanelToggleBtn">Thème</button>
      </div>
    </div>

    <div class="theme-panel-body">
      <div class="theme-accordion" data-section="connexion">
        <button type="button" class="theme-accordion-row" data-section="connexion">
          <span class="chevron">›</span> Connexion
        </button>
        <div class="theme-accordion-content" id="themeFields-connexion"></div>
      </div>

      <div class="theme-accordion" data-section="analyse">
        <button type="button" class="theme-accordion-row" data-section="analyse">
          <span class="chevron">›</span> Analyse
        </button>
        <div class="theme-accordion-content" id="themeFields-analyse"></div>
      </div>

      <div class="theme-accordion" data-section="evenements">
        <button type="button" class="theme-accordion-row" data-section="evenements">
          <span class="chevron">›</span> Événements
        </button>
        <div class="theme-accordion-content" id="themeFields-evenements"></div>
      </div>

      <div class="theme-accordion" data-section="parametres">
        <button type="button" class="theme-accordion-row" data-section="parametres">
          <span class="chevron">›</span> Paramètres
        </button>
        <div class="theme-accordion-content" id="themeFields-parametres"></div>
      </div>

      <div class="theme-accordion" data-section="general">
        <button type="button" class="theme-accordion-row" data-section="general">
          <span class="chevron">›</span> Général
        </button>
        <div class="theme-accordion-content" id="themeFields-general"></div>
      </div>

      <div class="theme-panel-footer">
        <button type="button" class="theme-footer-btn theme-footer-btn--primary" id="applySettingsBtn">✓ Appliquer</button>
        <button type="button" class="theme-footer-btn" id="resetSettingsBtn">↻ Réinitialiser</button>
        <button type="button" class="theme-footer-btn" id="collapseColorsBtn">▲ Replier les couleurs</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Sélecteur de couleur (une seule instance, réutilisée pour tous les champs) ===== -->
<div class="cp-overlay" id="cpOverlay">
  <div class="cp-modal">
    <div class="cp-title" id="cpTitle">COULEUR</div>
    <div class="cp-sw" id="cpWrap"><canvas id="cpCanvas"></canvas><div class="cp-cursor" id="cpCursor" style="left:100%;top:0%"></div></div>
    <label class="cp-hue-lbl">TEINTE</label>
    <input type="range" class="cp-hue" id="cpHue" min="0" max="360" value="0">
    <div class="cp-prev-row">
      <div class="cp-swatch" id="cpSwatch"></div>
      <input class="cp-hex" type="text" id="cpHex" maxlength="7" placeholder="#000000">
      <span class="cp-hex-lbl">HEX</span>
    </div>
    <div class="cp-mem-lbl">RÉCENTES</div>
    <div class="cp-mem" id="cpMem"></div>
    <div class="cp-btns">
      <button type="button" class="cp-btn cp-btn--ghost" id="cpCancelBtn">Annuler</button>
      <button type="button" class="cp-btn cp-btn--primary" id="cpConfirmBtn">Appliquer</button>
    </div>
  </div>
</div>

</div><!-- /#appShell -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<div class="save-spinner" id="saveSpinner" aria-hidden="true"></div>

<script src="./supabase-config.js" defer></script>
<script src="./auth.js" defer></script>
<script src="./theme-colors.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
